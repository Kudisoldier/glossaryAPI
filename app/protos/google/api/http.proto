syntax = "proto3";

package google.api;

option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";

// Minimal Http annotations to support OpenAPI generation
message Http {
  repeated HttpRule rules = 1;
}

message HttpRule {
  string selector = 1;
  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
  }
  string body = 7;
  string response_body = 12;
  repeated CustomHttpPattern additional_bindings = 11;
}

message CustomHttpPattern {
  string kind = 1;
  string path = 2;
}


